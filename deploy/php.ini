; Digital LEAP PHP settings for the container image.
; The evidence upload limit is 5 MB and profile photos 8 MB, so PHP must
; accept slightly more than that after multipart overhead.

upload_max_filesize = 8M
post_max_size = 12M
max_file_uploads = 10

expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/www/html/digital-leap/storage/logs/php-error.log

date.timezone = Africa/Freetown
default_charset = "UTF-8"

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
