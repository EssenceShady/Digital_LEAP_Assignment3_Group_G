# Digital LEAP — Apache virtual host for a self-managed server or the Docker
# image in deploy/Dockerfile. The document root is the application folder, so
# index.php, sw.js and public/ are reachable and nothing above them is.
#
# Adjust ServerName and the log paths for your host. PHP must run through
# mod_php or php-fpm; the rules below are plain Apache 2.4 directives.

<VirtualHost *:80>
    ServerName leap.example.sl
    DocumentRoot /var/www/html/digital-leap

    <Directory /var/www/html/digital-leap>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Defence in depth: these folders are never served even if AllowOverride
    # is turned off or a .htaccess file is lost. Downloads and uploads go
    # through index.php, which checks permissions first.
    <DirectoryMatch "^/var/www/html/digital-leap/(app|bin|config|storage|database)(/|$)">
        Require all denied
    </DirectoryMatch>

    # The PWA manifest and the service worker must not be cached as HTML.
    <Files "manifest.webmanifest">
        Header set Content-Type "application/manifest+json"
        Header set Cache-Control "no-cache"
    </Files>
    <Files "sw.js">
        Header set Cache-Control "no-cache"
        Header set Service-Worker-Allowed "/"
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/leap-error.log
    CustomLog ${APACHE_LOG_DIR}/leap-access.log combined
</VirtualHost>

# HTTPS is required for the installable app: browsers register a service
# worker only in a secure context (https:// or http://localhost). Terminate
# TLS here, or behind a reverse proxy that forwards X-Forwarded-Proto and set
# the application's base_url accordingly.

