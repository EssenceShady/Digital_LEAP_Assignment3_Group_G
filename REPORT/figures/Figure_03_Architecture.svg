dth="580" height="118" rx="10" fill="#FFFFFF" stroke="#0F3B2E" stroke-width="1.7" /><rect x="60" y="828" width="580" height="34" rx="10" fill="#0F3B2E" stroke="#0F3B2E" stroke-width="0" /><path d="M60 854 h580 v8 h-580 z" fill="#0F3B2E"/><text x="72" y="851" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="start" >Deployment options</text><text x="72" y="884" font-size="12.5" fill="#1F2933" font-weight="normal" text-anchor="start" >Apache with mod_rewrite and .htaccess</text><text x="72" y="903" font-size="12.5" fill="#1F2933" font-weight="normal" text-anchor="start" >or PHP built-in server with router.php</text><rect x="680" y="828" width="580" height="118" rx="10" fill="#FFFFFF" stroke="#0F3B2E" stroke-width="1.7" /><rect x="680" y="828" width="580" height="34" rx="10" fill="#0F3B2E" stroke="#0F3B2E" stroke-width="0" /><path d="M680 854 h580 v8 h-580 z" fill="#0F3B2E"/><text x="692" y="851" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="start" >Offline by design</text><text x="692" y="884" font-size="12.5" fill="#1F2933" font-weight="normal" text-anchor="start" >No external API or key; DIVA local model</text><text x="692" y="903" font-size="12.5" fill="#1F2933" font-weight="normal" text-anchor="start" >optional on 127.0.0.1:11434, disabled</text><rect x="1300" y="828" width="620" height="118" rx="10" fill="#FFFFFF" stroke="#0F3B2E" stroke-width="1.7" /><rect x="1300" y="828" width="620" height="34" rx="10" fill="#0F3B2E" stroke="#0F3B2E" stroke-width="0" /><path d="M1300 854 h620 v8 h-620 z" fill="#0F3B2E"/><text x="1312" y="851" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="start" >Backup and audit</text><text x="1312" y="884" font-size="12.5" fill="#1F2933" font-weight="normal" text-anchor="start" >Append-only audit_log with before/after JSON</text><text x="1312" y="903" font-size="12.5" fill="#1F2933" font-weight="normal" text-anchor="start" >Seed import only into a disposable database</text></svg>