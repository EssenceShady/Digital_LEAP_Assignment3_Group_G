" width="560" height="88" rx="10" fill="#FFFFFF" stroke="#0F3B2E" stroke-width="1.7" /><rect x="60" y="392" width="560" height="34" rx="10" fill="#0F3B2E" stroke="#0F3B2E" stroke-width="0" /><path d="M60 418 h560 v8 h-560 z" fill="#0F3B2E"/><text x="72" y="415" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="start" >Public assets</text><text x="72" y="448" font-size="12.5" fill="#1F2933" font-weight="normal" text-anchor="start" >public/assets/css/app.css</text><text x="72" y="467" font-size="12.5" fill="#1F2933" font-weight="normal" text-anchor="start" >public/assets/js/app.js (versioned)</text><rect x="700" y="120" width="600" height="380" rx="14" fill="#FBF7EE" stroke="#E0D3B8" stroke-width="1.2" /><text x="720" y="150" font-size="17" fill="#0F3B2E" font-weight="bold" text-anchor="start" >Application tier</text><rect x="720" y="168" width="560" height="78" rx="10" fill="#FFFFFF" stroke="#0F3B2E" stroke-width="1.7" /><rect x="720" y="168" width="560" height="34" rx="10" fill="#0F3B2E" stroke="#0F3B2E" stroke-width="0" /><path d="M720 194 h560 v8 h-560 z" fill="#0F3B2E"/><text x="732" y="191" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="start" >Router and Guard</text><text x="732" y="224" font-size="12.5" fill="#1F2933" font-weight="normal" text-anchor="start" >Route table + permission check before controller</text><rect x="720" y="262" width="560" height="78" rx="10" fill="#FFFFFF" stroke="#0F3B2E" stroke-width="1.7" /><rect x="720" y="262" width="560" height="34" rx="10" fill="#0F3B2E" stroke="#0F3B2E" stroke-width="0" /><path d="M720 288 h560 v8 h-560 z" fill="#0F3B2E"/><text x="732" y="285" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="start" >Controllers</text><text x="732" y="318" font-size="12.5" fill="#1F2933" font-weight="normal" text-anchor="start" >Student, Supervisor, Mentor, Coordinator,</text><text x="732" y="337" font-size="12.5" fill="#1F2933" font-weight="normal" text-anchor="start" >Management, Admin, 