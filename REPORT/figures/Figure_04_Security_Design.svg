<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1320" viewBox="0 0 2000 1320" font-family="Tahoma, Segoe UI, sans-serif"><rect width="2000" height="1320" fill="#FFFFFF"/><rect x="670" y="34" width="660" height="56" rx="10" fill="#0F3B2E" stroke="#0F3B2E" stroke-width="0" /><text x="1000" y="70" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >Figure 4  Security design: threat to control</text><rect x="40" y="130" width="420" height="180" rx="12" fill="#FBEFEF" stroke="#E3C3C3" stroke-width="1.4" /><text x="60" y="164" font-size="14" fill="#8C2F2F" font-weight="bold" text-anchor="start" >Threat</text><text x="60" y="192" font-size="13.5" fill="#1F2933" font-weight="normal" text-anchor="start" >Session hijack, clickjacking, MIME sniffing</text><line x1="462" y1="220" x2="500" y2="220" stroke="#B8953F" stroke-width="2.2" /><polygon points="500,220 490.0,224.5 490.0,215.5" fill="#B8953F"/><rect x="500" y="130" width="1460" height="180" rx="12" fill="#FBF7EE" stroke="#E0D3B8" stroke-width="1.4" /><text x="520" y="162" font-size="15.5" fill="#0F3B2E" font-weight="bold" text-anchor="start" >Perimeter and transport</text><rect x="520" y="186" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="532" y="208" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >Security headers (CSP, nosniff, DENY framing)</text><rect x="1230" y="186" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="1242" y="208" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >Session cookie: HttpOnly, SameSite=Lax, strict mode</text><rect x="520" y="226" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="532" y="248" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >storage/ and config/ denied over HTTP</text><rect x="40" y="360" width="420" height="180" rx="12" fill="#FBEFEF" stroke="#E3C3C3" stroke-width="1.4" /><text x="60" y="394" font-size="14" fill="#8C2F2F" font-weight="bold" text-anchor="start" >Threat</text><text x="60" y="422" font-size="13.5" fill="#1F2933" font-weight="normal" text-anchor="start" >Credential stuffing and brute force</text><line x1="462" y1="450" x2="500" y2="450" stroke="#B8953F" stroke-width="2.2" /><polygon points="500,450 490.0,454.5 490.0,445.5" fill="#B8953F"/><rect x="500" y="360" width="1460" height="180" rx="12" fill="#FBF7EE" stroke="#E0D3B8" stroke-width="1.4" /><text x="520" y="392" font-size="15.5" fill="#0F3B2E" font-weight="bold" text-anchor="start" >Identity and session</text><rect x="520" y="416" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="532" y="438" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >password_hash / password_verify</text><rect x="1230" y="416" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="1242" y="438" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >Five failures lock the account for 15 minutes</text><rect x="520" y="456" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="532" y="478" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >Idle 20 min and absolute 8 h timeouts</text><rect x="1230" y="456" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="1242" y="478" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >Forced password change on first sign-in</text><rect x="40" y="590" width="420" height="180" rx="12" fill="#FBEFEF" stroke="#E3C3C3" stroke-width="1.4" /><text x="60" y="624" font-size="14" fill="#8C2F2F" font-weight="bold" text-anchor="start" >Threat</text><text x="60" y="652" font-size="13.5" fill="#1F2933" font-weight="normal" text-anchor="start" >Broken access control (IDOR)</text><line x1="462" y1="680" x2="500" y2="680" stroke="#B8953F" stroke-width="2.2" /><polygon points="500,680 490.0,684.5 490.0,675.5" fill="#B8953F"/><rect x="500" y="590" width="1460" height="180" rx="12" fill="#FBF7EE" stroke="#E0D3B8" stroke-width="1.4" /><text x="520" y="622" font-size="15.5" fill="#0F3B2E" font-weight="bold" text-anchor="start" >Authorisation</text><rect x="520" y="646" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="532" y="668" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >Route permission checked by Guard</text><rect x="1230" y="646" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="1242" y="668" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >Role gates inside each controller</text><rect x="520" y="686" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="532" y="708" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >Object-level SQL scoping by student, mentor, supervisor</text><rect x="1230" y="686" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="1242" y="708" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >Permission-scoped avatar and download routes</text><rect x="40" y="820" width="420" height="180" rx="12" fill="#FBEFEF" stroke="#E3C3C3" stroke-width="1.4" /><text x="60" y="854" font-size="14" fill="#8C2F2F" font-weight="bold" text-anchor="start" >Threat</text><text x="60" y="882" font-size="13.5" fill="#1F2933" font-weight="normal" text-anchor="start" >SQL injection, XSS, CSRF, malicious uploads</text><line x1="462" y1="910" x2="500" y2="910" stroke="#B8953F" stroke-width="2.2" /><polygon points="500,910 490.0,914.5 490.0,905.5" fill="#B8953F"/><rect x="500" y="820" width="1460" height="180" rx="12" fill="#FBF7EE" stroke="#E0D3B8" stroke-width="1.4" /><text x="520" y="852" font-size="15.5" fill="#0F3B2E" font-weight="bold" text-anchor="start" >Input and data integrity</text><rect x="520" y="876" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="532" y="898" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >Prepared statements for every query</text><rect x="1230" y="876" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="1242" y="898" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >CSRF token on every POST (419 on failure)</text><rect x="520" y="916" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="532" y="938" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >Upload allow-list + finfo + getimagesize</text><rect x="1230" y="916" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="1242" y="938" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >Output escaped with e(); utf8mb4 storage</text><rect x="40" y="1050" width="420" height="180" rx="12" fill="#FBEFEF" stroke="#E3C3C3" stroke-width="1.4" /><text x="60" y="1084" font-size="14" fill="#8C2F2F" font-weight="bold" text-anchor="start" >Threat</text><text x="60" y="1112" font-size="13.5" fill="#1F2933" font-weight="normal" text-anchor="start" >Repudiation of grade changes</text><line x1="462" y1="1140" x2="500" y2="1140" stroke="#B8953F" stroke-width="2.2" /><polygon points="500,1140 490.0,1144.5 490.0,1135.5" fill="#B8953F"/><rect x="500" y="1050" width="1460" height="180" rx="12" fill="#FBF7EE" stroke="#E0D3B8" stroke-width="1.4" /><text x="520" y="1082" font-size="15.5" fill="#0F3B2E" font-weight="bold" text-anchor="start" >Accountability</text><rect x="520" y="1106" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="532" y="1128" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >Append-only audit_log with before/after JSON</text><rect x="1230" y="1106" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="1242" y="1128" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >mark.compute, publish and moderate audited</text><rect x="520" y="1146" width="690" height="32" rx="6" fill="#FFFFFF" stroke="#D9CDB4" stroke-width="1" /><text x="532" y="1168" font-size="13" fill="#1F2933" font-weight="normal" text-anchor="start" >DIVA answers refuse to change records</text><text x="40" y="1294" font-size="13" fill="#5B6873" font-weight="normal" text-anchor="start" >Every control listed is implemented in the submitted code; the evidence case for each is recorded in docs/test-log.md and docs/VERIFY.md.</text></svg>