# Digital LEAP — stack used by GitHub Codespaces and the Dev Containers CLI.
#
# The devcontainer starts this file, not deploy/docker-compose.yml, because a
# codespace has no prepared digital-leap/config/config.php and no host port
# 8080. The application code is bind-mounted so edits are served immediately;
# only storage/ lives in a volume (Apache runs as www-data there), and the
# config is the disposable one in this folder.
#
# ${localWorkspaceFolder} is supplied by the devcontainer CLI. Running this
# file with plain `docker compose` will not work without setting it.

services:
  app:
    build:
      context: ${localWorkspaceFolder}
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ${localWorkspaceFolder}/digital-leap:/var/www/html/digital-leap
      - leap-storage:/var/www/html/digital-leap/storage
      - ${localWorkspaceFolder}/.devcontainer/config.codespaces.php:/var/www/html/digital-leap/config/config.php:ro
    # service_started, not service_healthy: a slow seed must not keep Apache
    # from starting, or the forwarded port never opens and the codespace
    # reports a container error. setup.sh waits for the users table instead.
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: leap-demo
      MARIADB_DATABASE: digital_leap
    volumes:
      - leap-db:/var/lib/mysql
      - ${localWorkspaceFolder}/database/digital_leap.sql:/docker-entrypoint-initdb.d/10-digital-leap.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

volumes:
  leap-db:
  leap-storage:
